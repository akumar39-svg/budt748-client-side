<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Contact - Aditya Kumar</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <nav class="navbar navbar-expand-lg site-nav">
    <div class="container">
      <a class="navbar-brand" href="index.html">Aditya Kumar</a>

      <div>
        <a class="nav-link d-inline-block" href="index.html">Home</a>
        <a class="nav-link d-inline-block" href="about.html">About</a>
        <a class="nav-link d-inline-block active" href="contact.html">Contact</a>
      </div>
    </div>
  </nav>

  <main class="page-section">
    <div class="container">
      <div class="row align-items-center g-5">
        <div class="col-lg-6">
          <h1>Contact Me</h1>

          <p>
            I would love to hear from you.
            Feel free to reach out using the information below.
          </p>

          <p>Email: akumar39@umd.edu</p>
        </div>

        <div class="col-lg-5">
          <div class="contact-card">
            <h2>Get in Touch</h2>

            <form>
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control">
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control">
              </div>

              <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" class="form-control" rows="4"></textarea>
              </div>

              <button type="submit" class="btn btn-accent">
                Submit
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
